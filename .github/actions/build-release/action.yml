name: Build immutable release
description: Test, build, scan, create an SBOM and upload one promotable image artifact

outputs:
  artifact-name:
    description: Release artifact name
    value: ${{ steps.package.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Require a release commit from main
      shell: bash
      run: |
        set -Eeuo pipefail
        git fetch --no-tags origin main:refs/remotes/origin/main
        git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.x
        cache: npm

    - name: Install locked dependencies
      shell: bash
      run: npm ci

    - name: Run quality gates
      shell: bash
      run: |
        npm run lint
        npm test

    - name: Build immutable container
      shell: bash
      env:
        IMAGE_TAG: delivery-demo:build-${{ github.sha }}
      run: |
        docker build --pull \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --tag "$IMAGE_TAG" .

    - name: Block high and critical image vulnerabilities
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: delivery-demo:build-${{ github.sha }}
        format: table
        exit-code: "1"
        ignore-unfixed: true
        severity: HIGH,CRITICAL

    - name: Generate CycloneDX SBOM
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: delivery-demo:build-${{ github.sha }}
        format: cyclonedx
        output: image.sbom.cdx.json

    - name: Export release image
      id: package
      shell: bash
      env:
        IMAGE_TAG: delivery-demo:build-${{ github.sha }}
      run: |
        artifact_name="release-image-${GITHUB_SHA}"
        docker image save --output release-image.tar "$IMAGE_TAG"
        echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

    - name: Upload immutable release artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.package.outputs.artifact-name }}
        path: |
          release-image.tar
          image.sbom.cdx.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
