name: Bootstrap one private-ACR infrastructure stage
description: Create the foundation, publish a scanned first image if needed, then reconcile the workload

inputs:
  platform:
    description: Platform identifier
    required: true
  foundation-template:
    description: Subscription-scope foundation Bicep entry point
    required: true
  workload-template:
    description: Subscription-scope workload Bicep entry point
    required: true
  stage:
    description: Lifecycle stage
    required: true
  artifact-name:
    description: Build-once release artifact used only when no workload exists
    required: true
  azure-client-id:
    description: Infrastructure OIDC client ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  azure-location:
    description: Azure resource location
    required: true
  azure-resource-group:
    description: Shared platform resource group
    required: true
  azure-resource-prefix:
    description: Lowercase alphanumeric resource prefix
    required: true
  azure-deployment-profile:
    description: Cost and resilience profile
    required: true
  deployment-principal-object-id:
    description: Application-delivery principal object ID
    required: true
  publisher-principal-object-id:
    description: Infrastructure publisher principal object ID
    required: true

runs:
  using: composite
  steps:
    - name: Deploy private platform foundation
      uses: ./.github/actions/infra-stage
      with:
        platform: ${{ inputs.platform }}-foundation
        template: ${{ inputs.foundation-template }}
        stage: ${{ inputs.stage }}
        apply: "true"
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-location: ${{ inputs.azure-location }}
        azure-resource-group: ${{ inputs.azure-resource-group }}
        azure-resource-prefix: ${{ inputs.azure-resource-prefix }}
        azure-deployment-profile: ${{ inputs.azure-deployment-profile }}
        deployment-principal-object-id: ${{ inputs.deployment-principal-object-id }}
        publisher-principal-object-id: ${{ inputs.publisher-principal-object-id }}

    - name: Preserve an existing promoted workload image
      id: current
      shell: bash
      env:
        AZURE_CORE_OUTPUT: none
        PLATFORM: ${{ inputs.platform }}
        STAGE: ${{ inputs.stage }}
        AZURE_RESOURCE_GROUP: ${{ inputs.azure-resource-group }}
      run: |
        set -Eeuo pipefail
        image_ref=""
        release_sha=""

        if [[ "$PLATFORM" == "app-service" ]]; then
          app_name="$(az webapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.application=='delivery-demo' && tags.strategy=='blue-green' && tags.environment=='${STAGE}'].name | [0]" \
            --output tsv)"
          if [[ -n "$app_name" ]]; then
            image_ref="$(az webapp config container show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
              --output tsv)"
            release_sha="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "[?name=='RELEASE_SHA'].value | [0]" \
              --output tsv)"
          fi
        elif [[ "$PLATFORM" == "container-apps" ]]; then
          app_name="$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.application=='delivery-demo' && tags.strategy=='canary' && tags.environment=='${STAGE}'].name | [0]" \
            --output tsv)"
          if [[ -n "$app_name" ]]; then
            image_ref="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query 'properties.template.containers[0].image' \
              --output tsv)"
            release_sha="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query "properties.template.containers[0].env[?name=='RELEASE_SHA'].value | [0]" \
              --output tsv)"
          fi
        else
          echo "::error::Unsupported private-ACR platform '$PLATFORM'."
          exit 1
        fi

        if [[ -z "$image_ref" ]]; then
          mapfile -t acr_names < <(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.application=='delivery-demo'].name" \
            --output tsv)
          if [[ "${#acr_names[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one delivery-demo ACR in '$AZURE_RESOURCE_GROUP'; found ${#acr_names[@]}."
            exit 1
          fi
          existing_digest="$(az acr repository show \
            --name "${acr_names[0]}" \
            --image "delivery-demo:${GITHUB_SHA}" \
            --query digest \
            --output tsv 2>/dev/null || true)"
          if [[ -n "$existing_digest" ]]; then
            image_ref="${acr_names[0]}.azurecr.io/delivery-demo@${existing_digest}"
            release_sha="$GITHUB_SHA"
          fi
        fi

        if [[ -n "$image_ref" && -n "$release_sha" ]]; then
          [[ "$image_ref" =~ ^[a-z0-9]+\.azurecr\.io/delivery-demo@sha256:[a-f0-9]{64}$ ]]
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
        else
          if [[ -n "$image_ref" || -n "$release_sha" ]]; then
            echo "::warning::Existing workload metadata is incomplete; republishing the verified bootstrap artifact."
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish scanned image to private ACR
      if: steps.current.outputs.exists != 'true'
      id: publish
      uses: ./.github/actions/publish-image
      with:
        artifact-name: ${{ inputs.artifact-name }}
        azure-resource-group: ${{ inputs.azure-resource-group }}

    - name: Deploy workload from private digest
      uses: ./.github/actions/infra-stage
      with:
        platform: ${{ inputs.platform }}-workload
        template: ${{ inputs.workload-template }}
        stage: ${{ inputs.stage }}
        apply: "true"
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-location: ${{ inputs.azure-location }}
        azure-resource-group: ${{ inputs.azure-resource-group }}
        azure-resource-prefix: ${{ inputs.azure-resource-prefix }}
        azure-deployment-profile: ${{ inputs.azure-deployment-profile }}
        deployment-principal-object-id: ${{ inputs.deployment-principal-object-id }}
        image-reference: ${{ steps.current.outputs.image-ref || steps.publish.outputs.image-ref }}
        release-sha: ${{ steps.current.outputs.release-sha || github.sha }}
