name: CI
run-name: >-
  CI checks • ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('push {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.x

jobs:
  quality:
    name: Test, lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run repository security and policy checks
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          arguments: >-
            .github
            .trunk/trunk.yaml
            Dockerfile
            README.md
            docs
            infra
            src
            test
            deploy/aks/chart/Chart.yaml
            deploy/aks/chart/values.yaml
            deploy/aks/chart/values.schema.json
            --print-failures
            --no-fix

      - name: Validate the Helm chart
        run: |
          helm lint deploy/aks/chart --strict \
            --set-string image.repository=example.azurecr.io/delivery-demo \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string deployment.releaseSha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string deployment.stage=dev \
            --set-string service.type=ClusterIP \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --set autoscaling.minReplicas=1 \
            --set autoscaling.maxReplicas=2

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build container without publishing
        run: docker build --pull --tag delivery-demo:ci .

      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: delivery-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  bicep:
    name: Compile Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compile infrastructure template
        run: |
          if rg --line-number "cpu(Limit|Request):.*'[0-9]+'" infra/aks/platform.bicep; then
            echo "AKS Managed Namespace CPU quotas must use milliCPU notation such as 1000m." >&2
            exit 1
          fi
          az bicep build --file infra/app-service/main.bicep --stdout > /dev/null
          az bicep build --file infra/app-service/workload-main.bicep --stdout > /dev/null
          az bicep build --file infra/container-apps/main.bicep --stdout > /dev/null
          az bicep build --file infra/container-apps/workload-main.bicep --stdout > /dev/null
          az bicep build --file infra/aks/main.bicep --stdout > /dev/null
          az bicep build --file infra/bootstrap/main.bicep --stdout > /dev/null
