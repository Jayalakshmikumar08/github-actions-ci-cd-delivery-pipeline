{{- $repository := required "image.repository must be the Bicep-provisioned ACR repository" .Values.image.repository -}}
{{- $digest := required "image.digest must be the promoted immutable image digest" .Values.image.digest -}}
{{- $releaseSha := required "deployment.releaseSha must be the promoted Git commit" .Values.deployment.releaseSha -}}
{{- $stage := required "deployment.stage must be the target lifecycle stage" .Values.deployment.stage -}}
{{- $serviceType := required "service.type must be ClusterIP or LoadBalancer" .Values.service.type -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: delivery-demo
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery-demo
        app.kubernetes.io/version: {{ $releaseSha | trunc 12 | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RELEASE_SHA
              value: {{ $releaseSha | quote }}
            - name: DEPLOYMENT_STRATEGY
              value: rolling
            - name: DEPLOYMENT_STAGE
              value: {{ $stage | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: delivery-demo
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  selector:
    app.kubernetes.io/name: delivery-demo
  ports:
    - name: http
      port: 80
      targetPort: http
  type: {{ $serviceType }}
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delivery-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: delivery-demo
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery-demo
---
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delivery-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: delivery-demo
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: delivery-demo
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
